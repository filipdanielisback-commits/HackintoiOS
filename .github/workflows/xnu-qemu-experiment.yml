name: XNU QEMU feasibility experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xnu/qemu-experiment/**"
      - ".github/workflows/xnu-qemu-experiment.yml"

permissions:
  contents: read

jobs:
  inspect-upstream:
    name: Inspect pinned XNU build and ARM64 boot prerequisites
    runs-on: ubuntu-24.04
    steps:
      - name: Check out HackintoiOS
        uses: actions/checkout@v4

      - name: Validate experiment definition
        run: python3 tools/check-xnu-qemu-experiment.py

      - name: Check out public XNU candidate
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: 43a90889846e00bfb5cf1d255cdc0a701a1e05a4
          path: upstream-xnu
          submodules: false

      - name: Record source identity and inspect build entry points
        run: |
          set -euo pipefail
          mkdir -p out
          {
            echo "HackintoiOS XNU QEMU feasibility experiment"
            echo "Candidate commit:"
            git -C upstream-xnu rev-parse HEAD
            echo
            echo "Top-level build files:"
            find upstream-xnu -maxdepth 2 -type f \\( -name Makefile -o -name makefile -o -name '*.xcodeproj' \\) | sort | head -100
            echo
            echo "ARM64 architecture references:"
            grep -RIlE 'arm64|ARM64|arm64e' upstream-xnu/bsd upstream-xnu/osfmk upstream-xnu/makedefs 2>/dev/null | head -100 || true
            echo
            echo "Build host:"
            uname -a
            echo
            echo "Available tools:"
            command -v clang || true
            clang --version || true
            command -v xcodebuild || true
            command -v qemu-system-aarch64 || true
          } | tee out/feasibility-report.txt

      - name: Check candidate identity and preserve report
        run: |
          test "$(git -C upstream-xnu rev-parse HEAD)" = "43a90889846e00bfb5cf1d255cdc0a701a1e05a4"
          test -s out/feasibility-report.txt

      - name: Upload feasibility report
        uses: actions/upload-artifact@v4
        with:
          name: xnu-qemu-feasibility-report
          path: out/feasibility-report.txt
          if-no-files-found: error
          retention-days: 14
