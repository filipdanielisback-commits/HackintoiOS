name: Sysimage tools checks

on:
  push:
    branches: [main]
    paths:
      - "sysimage/**"
      - "tools/test-sysimage.py"
      - ".github/workflows/sysimage-check.yml"
  pull_request:
    paths:
      - "sysimage/**"
      - "tools/test-sysimage.py"
      - ".github/workflows/sysimage-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile sysimage/ipsw-member.py sysimage/select-system.py sysimage/mkvarskel.py tools/test-sysimage.py
      - name: Check shell syntax
        run: bash -n sysimage/unpack.sh
      - name: Run synthetic IPSW tests
        run: python3 tools/test-sysimage.py
