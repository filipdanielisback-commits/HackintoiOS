name: HackintoiOS UEFI loader

on:
  push:
    branches: [main]
    paths:
      - "bootloader/**"
      - "tools/check-uefi-artifact.py"
      - "tools/test-uefi-qemu.sh"
      - ".github/workflows/bootloader-uefi.yml"
  pull_request:
    paths:
      - "bootloader/**"
      - "tools/check-uefi-artifact.py"
      - "tools/test-uefi-qemu.sh"
      - ".github/workflows/bootloader-uefi.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aarch64-uefi:
    name: Build and QEMU-test AArch64 UEFI application
    runs-on: ubuntu-24.04
    steps:
      - name: Check out HackintoiOS
        uses: actions/checkout@v4

      - name: Install build and emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            uuid-dev \
            nasm \
            acpica-tools \
            python3 \
            qemu-system-arm \
            qemu-efi-aarch64

      - name: Check out EDK II
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202405
          path: edk2
          submodules: false

      - name: Initialize EDK II build submodules
        working-directory: edk2
        run: |
          set -euxo pipefail
          git submodule update --init --recursive -- . ':(exclude)UnitTestFrameworkPkg/Library/SubhookLib/subhook'

      - name: Build EDK II BaseTools
        working-directory: edk2
        run: make -C BaseTools

      - name: Build HackintoiOS UEFI application
        working-directory: edk2
        env:
          GCC5_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          set -eo pipefail
          source edksetup.sh
          # The module must be registered in the platform DSC before -m can build it.
          # Generate a CI-only overlay; leave the pinned upstream EDK II tree unchanged.
          cp ArmVirtPkg/ArmVirtQemu.dsc ArmVirtPkg/HackintoiOSQemu.dsc
          python3 - <<'PY'
          from pathlib import Path
          dsc = Path("ArmVirtPkg/HackintoiOSQemu.dsc")
          text = dsc.read_text(encoding="utf-8")
          marker = "[Components.common]\n"
          module = "../bootloader/uefi/HackintoiOSLoader.inf\n"
          if marker not in text:
              raise SystemExit("ArmVirtQemu.dsc has no [Components.common] section")
          if module not in text:
              text = text.replace(marker, marker + module, 1)
          dsc.write_text(text, encoding="utf-8")
          PY
          build \
            -p ArmVirtPkg/HackintoiOSQemu.dsc \
            -m ../bootloader/uefi/HackintoiOSLoader.inf \
            -a AARCH64 \
            -t GCC5 \
            -b RELEASE

      - name: Locate and validate EFI application
        run: |
          set -euxo pipefail
          EFI_FILE="$(find edk2/Build -type f -name HackintoiOSLoader.efi -print -quit)"
          test -n "$EFI_FILE"
          mkdir -p dist
          cp "$EFI_FILE" dist/HackintoiOSLoader.efi
          python3 tools/check-uefi-artifact.py dist/HackintoiOSLoader.efi

      - name: Execute UEFI application in QEMU
        run: bash tools/test-uefi-qemu.sh dist/HackintoiOSLoader.efi

      - name: Upload UEFI application
        uses: actions/upload-artifact@v4
        with:
          name: hackintoiOS-aarch64-uefi-prototype
          path: dist/HackintoiOSLoader.efi
          if-no-files-found: error
          retention-days: 14
