name: Userland scaffold checks

on:
  push:
    branches: [main]
    paths:
      - "userland/**"
      - ".github/workflows/userland-check.yml"
  pull_request:
    paths:
      - "userland/**"
      - ".github/workflows/userland-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check shell syntax
        run: sh -n userland/build.sh
      - name: Build portable smoke-test program
        run: sh userland/build.sh "$RUNNER_TEMP/hackintoios-userland"
      - name: Run portable smoke-test program
        run: "$RUNNER_TEMP/hackintoios-userland/hackintoios-hello"
